<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ortak Bütçe</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
<style>
:root {
  --primary: #6366f1;
  --accent: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --bg: #ffffff;
  --surface: #f9fafb;
  --border: #e5e7eb;
  --text: #111827;
  --text-muted: #6b7280;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --text-muted: #cbd5e1;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 16px;
  margin: 0;
}
h1, h2, h3 { font-weight: 700; }
.container { max-width: 1200px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
.sync-badge { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--surface); border-radius: 20px; font-size: 12px; }
.sync-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab-btn { padding: 12px 16px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); cursor: pointer; font-weight: 500; white-space: nowrap; }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab-content { display: none; }
.tab-content.active { display: block; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.card-value { font-size: 24px; font-weight: 700; margin: 8px 0; font-family: monospace; }
.card-value.positive { color: var(--accent); }
.card-value.negative { color: var(--danger); }
button { cursor: pointer; border: none; border-radius: 8px; font-weight: 500; padding: 10px 16px; font-size: 14px; transition: all 0.2s; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: #4f46e5; }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: var(--danger); color: white; }
input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-family: inherit; margin-bottom: 12px; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
.modal.active { display: flex; }
.modal-content { background: var(--bg); border-radius: 10px; padding: 24px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
.expense-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
.budget-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.progress-bar { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
.empty-state { text-align: center; padding: 32px 16px; color: var(--text-muted); }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } .header { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>💑 Ortak Bütçe</h1>
      <p style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 13px;">Ücretsiz ve Sonsuz</p>
    </div>
    <div class="sync-badge">
      <div class="sync-dot"></div>
      <span id="syncStatus">Bağlanıyor...</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="dashboard">📊 Panel</button>
    <button class="tab-btn" data-tab="expenses">💸 Harcamalar</button>
    <button class="tab-btn" data-tab="budget">📋 Bütçe</button>
    <button class="tab-btn" data-tab="debts">💳 Borçlar</button>
    <button class="tab-btn" data-tab="reports">📈 Raporlar</button>
  </div>

  <div class="tab-content active" id="dashboard">
    <div class="grid">
      <div class="card">
        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">💰 Gelir</div>
        <div class="card-value positive" id="totalIncome">0 ₺</div>
      </div>
      <div class="card">
        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">💸 Harcama</div>
        <div class="card-value negative" id="totalExpense">0 ₺</div>
      </div>
      <div class="card">
        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">📊 Kalan</div>
        <div class="card-value" id="balance">0 ₺</div>
      </div>
      <div class="card">
        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">💳 Borç</div>
        <div class="card-value negative" id="totalDebt">0 ₺</div>
      </div>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;">
      <button class="btn-primary" onclick="openModal('expenseModal')">➕ Harcama</button>
      <button class="btn-primary" onclick="openModal('incomeModal')">➕ Gelir</button>
      <button class="btn-primary" onclick="openModal('debtModal')">➕ Borç</button>
      <button class="btn-secondary" onclick="openModal('budgetModal')">📋 Bütçe</button>
    </div>

    <div class="card">
      <h3 style="margin-top: 0;">📌 Bütçeler</h3>
      <div id="budgetOverview"></div>
    </div>
  </div>

  <div class="tab-content" id="expenses">
    <button class="btn-primary" style="width: 100%; margin-bottom: 16px;" onclick="openModal('expenseModal')">➕ Harcama Ekle</button>
    <div id="expensesList"></div>
  </div>

  <div class="tab-content" id="budget">
    <button class="btn-primary" style="width: 100%; margin-bottom: 16px;" onclick="openModal('budgetModal')">📋 Bütçe Ayarla</button>
    <div id="budgetDetails"></div>
  </div>

  <div class="tab-content" id="debts">
    <button class="btn-primary" style="width: 100%; margin-bottom: 16px;" onclick="openModal('debtModal')">➕ Borç Ekle</button>
    <div id="debtList"></div>
  </div>

  <div class="tab-content" id="reports">
    <div id="reportsContent"></div>
  </div>
</div>

<div class="modal" id="expenseModal">
  <div class="modal-content">
    <h2>💸 Harcama Ekle</h2>
    <input type="text" id="expName" placeholder="Açıklama (Örn: Market)">
    <input type="number" id="expAmount" placeholder="Tutar" step="0.01" min="0">
    <select id="expCategory">
      <option value="market">🛒 Market</option>
      <option value="kira">🏠 Kira</option>
      <option value="fatura">⚡ Fatura</option>
      <option value="ulaşım">🚗 Ulaşım</option>
      <option value="yemek">🍽️ Yemek</option>
      <option value="sağlık">🏥 Sağlık</option>
      <option value="diğer">📌 Diğer</option>
    </select>
    <select id="expPerson">
      <option value="ortak">İkimiz Birlikte</option>
      <option value="ben">Ben</option>
      <option value="eş">Eşim</option>
    </select>
    <input type="date" id="expDate">
    <button class="btn-primary" style="width: 100%;" onclick="addExpense()">Ekle</button>
    <button class="btn-secondary" style="width: 100%; margin-top: 8px;" onclick="closeModal('expenseModal')">İptal</button>
  </div>
</div>

<div class="modal" id="incomeModal">
  <div class="modal-content">
    <h2>💵 Gelir Ekle</h2>
    <input type="text" id="incName" placeholder="Gelir Türü (Maaş, Bonus vb.)">
    <input type="number" id="incAmount" placeholder="Tutar" step="0.01" min="0">
    <select id="incPerson">
      <option value="ben">Ben</option>
      <option value="eş">Eşim</option>
    </select>
    <input type="date" id="incDate">
    <button class="btn-primary" style="width: 100%;" onclick="addIncome()">Ekle</button>
    <button class="btn-secondary" style="width: 100%; margin-top: 8px;" onclick="closeModal('incomeModal')">İptal</button>
  </div>
</div>

<div class="modal" id="debtModal">
  <div class="modal-content">
    <h2>💳 Borç Ekle</h2>
    <input type="text" id="debtName" placeholder="Borç Adı (Kredi Kartı, Banka vb.)">
    <input type="number" id="debtAmount" placeholder="Toplam Tutar" step="0.01" min="0">
    <input type="number" id="debtInterest" placeholder="Faiz %" step="0.1" min="0">
    <input type="number" id="debtMonthly" placeholder="Aylık Ödeme" step="0.01" min="0">
    <input type="date" id="debtDate">
    <button class="btn-primary" style="width: 100%;" onclick="addDebt()">Ekle</button>
    <button class="btn-secondary" style="width: 100%; margin-top: 8px;" onclick="closeModal('debtModal')">İptal</button>
  </div>
</div>

<div class="modal" id="budgetModal">
  <div class="modal-content">
    <h2>📋 Aylık Bütçe Ayarla</h2>
    <div id="budgetFormFields"></div>
    <button class="btn-primary" style="width: 100%;" onclick="saveBudget()">Kaydet</button>
  </div>
</div>

<script>
const categories = [
  { id: 'market', name: 'Market', emoji: '🛒' },
  { id: 'kira', name: 'Kira', emoji: '🏠' },
  { id: 'fatura', name: 'Fatura', emoji: '⚡' },
  { id: 'ulaşım', name: 'Ulaşım', emoji: '🚗' },
  { id: 'yemek', name: 'Yemek', emoji: '🍽️' },
  { id: 'sağlık', name: 'Sağlık', emoji: '🏥' },
  { id: 'diğer', name: 'Diğer', emoji: '📌' },
];

let db = null;
let data = { expenses: [], incomes: [], debts: [], budgets: {} };

const firebaseConfig = {
  apiKey: "AIzaSyC-•••••••••••••••••••••••••••••••",
  authDomain: "couple-budget-5c2eb.firebaseapp.com",
  databaseURL: "https://couple-budget-5c2eb-default-rtdb.europe-west1.firebaseio.com",
  projectId: "couple-budget-5c2eb",
  storageBucket: "couple-budget-5c2eb.firebasestorage.app",
  messagingSenderId: "798847239534",
  appId: "1:798847239534:web:8d7275bd50519bfe5f2d7f"
};

try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  subscribeToAll();
  document.getElementById('syncStatus').textContent = 'Senkron Aktif';
} catch (e) {
  console.log('Firebase bağlantısı yapılamadı:', e.message);
  document.getElementById('syncStatus').textContent = 'Yerel Mod';
  loadLocal();
}

function subscribeToAll() {
  if (!db) return;
  db.ref('expenses').on('value', snap => {
    data.expenses = snap.val() ? Object.values(snap.val()) : [];
    renderAll();
  });
  db.ref('incomes').on('value', snap => {
    data.incomes = snap.val() ? Object.values(snap.val()) : [];
    renderAll();
  });
  db.ref('debts').on('value', snap => {
    data.debts = snap.val() ? Object.values(snap.val()) : [];
    renderAll();
  });
  db.ref('budgets').on('value', snap => {
    data.budgets = snap.val() || {};
    renderAll();
  });
}

function saveLocal() {
  localStorage.setItem('budgetData', JSON.stringify(data));
}

function loadLocal() {
  const saved = localStorage.getItem('budgetData');
  if (saved) data = JSON.parse(saved);
  renderAll();
}

function saveToFirebase() {
  if (!db) {
    saveLocal();
    return;
  }
  db.ref('expenses').set(data.expenses);
  db.ref('incomes').set(data.incomes);
  db.ref('debts').set(data.debts);
  db.ref('budgets').set(data.budgets);
}

function getMonth(dateStr) {
  return dateStr.substring(0, 7);
}

function getCurrentMonth() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
}

function formatCurrency(n) {
  return n.toLocaleString('tr-TR', { minimumFractionDigits: 2 }) + ' ₺';
}

function addExpense() {
  const exp = {
    id: Date.now().toString(),
    name: document.getElementById('expName').value,
    amount: parseFloat(document.getElementById('expAmount').value),
    category: document.getElementById('expCategory').value,
    person: document.getElementById('expPerson').value,
    date: document.getElementById('expDate').value,
  };
  if (!exp.name || !exp.amount) return alert('Lütfen tüm alanları doldurun');
  data.expenses.push(exp);
  saveToFirebase();
  closeModal('expenseModal');
  document.getElementById('expName').value = '';
  document.getElementById('expAmount').value = '';
}

function addIncome() {
  const inc = {
    id: Date.now().toString(),
    name: document.getElementById('incName').value,
    amount: parseFloat(document.getElementById('incAmount').value),
    person: document.getElementById('incPerson').value,
    date: document.getElementById('incDate').value,
  };
  data.incomes.push(inc);
  saveToFirebase();
  closeModal('incomeModal');
}

function addDebt() {
  const debt = {
    id: Date.now().toString(),
    name: document.getElementById('debtName').value,
    amount: parseFloat(document.getElementById('debtAmount').value),
    interest: parseFloat(document.getElementById('debtInterest').value) || 0,
    monthly: parseFloat(document.getElementById('debtMonthly').value) || 0,
    date: document.getElementById('debtDate').value,
    remaining: parseFloat(document.getElementById('debtAmount').value),
  };
  data.debts.push(debt);
  saveToFirebase();
  closeModal('debtModal');
}

function saveBudget() {
  document.querySelectorAll('.budget-input').forEach(inp => {
    data.budgets[inp.dataset.cat] = parseFloat(inp.value) || 0;
  });
  saveToFirebase();
  closeModal('budgetModal');
}

function calculateTotals() {
  const month = getCurrentMonth();
  const inc = data.incomes.filter(i => getMonth(i.date) === month).reduce((s, i) => s + i.amount, 0);
  const exp = data.expenses.filter(e => getMonth(e.date) === month).reduce((s, e) => s + e.amount, 0);
  const debt = data.debts.reduce((s, d) => s + (d.remaining || d.amount), 0);
  return { inc, exp, debt, bal: inc - exp };
}

function renderAll() {
  const { inc, exp, debt, bal } = calculateTotals();
  document.getElementById('totalIncome').textContent = formatCurrency(inc);
  document.getElementById('totalExpense').textContent = formatCurrency(exp);
  document.getElementById('totalDebt').textContent = formatCurrency(debt);
  const balEl = document.getElementById('balance');
  balEl.textContent = formatCurrency(bal);
  balEl.className = 'card-value' + (bal >= 0 ? ' positive' : ' negative');
  renderBudgetOverview();
  renderExpenses();
  renderDebts();
  renderBudgetDetails();
  renderReports();
}

function renderBudgetOverview() {
  const month = getCurrentMonth();
  const byCategory = {};
  data.expenses.filter(e => getMonth(e.date) === month).forEach(e => {
    byCategory[e.category] = (byCategory[e.category] || 0) + e.amount;
  });
  let html = '';
  categories.forEach(cat => {
    const spent = byCategory[cat.id] || 0;
    const budget = data.budgets[cat.id] || 0;
    const pct = budget > 0 ? (spent / budget * 100) : 0;
    html += `
      <div class="budget-progress">
        <div style="flex-shrink: 0; width: 80px; font-size: 12px;">
          <div>${cat.emoji} ${cat.name}</div>
          <div style="color: var(--text-muted);">${formatCurrency(spent)} / ${formatCurrency(budget)}</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${Math.min(pct, 100)}%"></div></div>
      </div>
    `;
  });
  document.getElementById('budgetOverview').innerHTML = html;
}

function renderExpenses() {
  const sorted = [...data.expenses].sort((a, b) => new Date(b.date) - new Date(a.date));
  if (!sorted.length) {
    document.getElementById('expensesList').innerHTML = '<div class="empty-state">Harcama yok</div>';
    return;
  }
  let html = '';
  sorted.forEach(e => {
    const cat = categories.find(c => c.id === e.category);
    html += `
      <div class="expense-item">
        <div>
          <div style="font-weight: 600;">${cat ? cat.emoji : ''} ${e.name}</div>
          <div style="font-size: 12px; color: var(--text-muted);">${new Date(e.date).toLocaleDateString('tr-TR')} • ${e.person === 'ben' ? 'Ben' : 'Eşim'}</div>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <div style="font-weight: 600;">- ${formatCurrency(e.amount)}</div>
          <button class="btn-danger" style="padding: 4px 8px; font-size: 11px;" onclick="deleteExpense('${e.id}')">Sil</button>
        </div>
      </div>
    `;
  });
  document.getElementById('expensesList').innerHTML = html;
}

function renderDebts() {
  if (!data.debts.length) {
    document.getElementById('debtList').innerHTML = '<div class="empty-state">Borç yok ✨</div>';
    return;
  }
  let html = '';
  data.debts.forEach(d => {
    const rem = d.remaining || d.amount;
    const pct = (rem / d.amount) * 100;
    html += `
      <div class="card" style="margin-bottom: 12px;">
        <div style="font-weight: 600; margin-bottom: 8px;">${d.name}</div>
        <div class="progress-bar" style="margin-bottom: 8px;"><div class="progress-fill" style="width: ${100 - pct}%"></div></div>
        <div style="display: flex; gap: 12px; margin-bottom: 12px; font-size: 12px;">
          <div>Kalan: ${formatCurrency(rem)}</div>
          <div>Aylık: ${formatCurrency(d.monthly)}</div>
        </div>
        <button class="btn-primary" style="width: 100%; margin-bottom: 8px; font-size: 12px;" onclick="payDebt('${d.id}')">Ödemeyi Kaydet</button>
        <button class="btn-danger" style="width: 100%; font-size: 12px;" onclick="deleteDebt('${d.id}')">Sil</button>
      </div>
    `;
  });
  document.getElementById('debtList').innerHTML = html;
}

function renderBudgetDetails() {
  const month = getCurrentMonth();
  const byCategory = {};
  data.expenses.filter(e => getMonth(e.date) === month).forEach(e => {
    byCategory[e.category] = (byCategory[e.category] || 0) + e.amount;
  });
  let html = '';
  categories.forEach(cat => {
    const spent = byCategory[cat.id] || 0;
    const budget = data.budgets[cat.id] || 0;
    const remaining = budget - spent;
    html += `
      <div class="card" style="margin-bottom: 12px;">
        <div style="display: flex; justify-content: space-between;">
          <div>
            <div style="font-weight: 600;">${cat.emoji} ${cat.name}</div>
            <div style="font-size: 12px; color: var(--text-muted);">Harcanan: ${formatCurrency(spent)} / ${formatCurrency(budget)}</div>
          </div>
          <div style="text-align: right;">
            <div style="font-weight: 600;">${formatCurrency(remaining)}</div>
            <div style="font-size: 12px; color: ${remaining >= 0 ? 'var(--accent)' : 'var(--danger)'};">${remaining >= 0 ? 'Kaldı' : 'Aşım'}</div>
          </div>
        </div>
      </div>
    `;
  });
  document.getElementById('budgetDetails').innerHTML = html;
}

function renderReports() {
  const month = getCurrentMonth();
  const monthExp = data.expenses.filter(e => getMonth(e.date) === month);
  const byCategory = {};
  monthExp.forEach(e => {
    byCategory[e.category] = (byCategory[e.category] || 0) + e.amount;
  });
  let html = '<h3>📊 Kategori Dağılımı</h3>';
  const sorted = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
  const max = sorted[0]?.[1] || 1;
  sorted.forEach(([cat, amount]) => {
    const info = categories.find(c => c.id === cat);
    html += `
      <div class="budget-progress">
        <div style="flex-shrink: 0; width: 80px; font-size: 12px;">${info?.emoji} ${info?.name}</div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${(amount / max) * 100}%"></div></div>
        <div style="width: 80px; text-align: right; font-size: 12px;">${formatCurrency(amount)}</div>
      </div>
    `;
  });
  document.getElementById('reportsContent').innerHTML = html;
}

function deleteExpense(id) {
  data.expenses = data.expenses.filter(e => e.id !== id);
  saveToFirebase();
}

function deleteDebt(id) {
  data.debts = data.debts.filter(d => d.id !== id);
  saveToFirebase();
}

function payDebt(id) {
  const debt = data.debts.find(d => d.id === id);
  if (!debt) return;
  debt.remaining = Math.max(0, (debt.remaining || debt.amount) - (debt.monthly || 0));
  saveToFirebase();
}

function openModal(id) {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('expDate').value = today;
  document.getElementById('incDate').value = today;
  document.getElementById('debtDate').value = today;
  if (id === 'budgetModal') updateBudgetForm();
  document.getElementById(id).classList.add('active');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function updateBudgetForm() {
  let html = '';
  categories.forEach(cat => {
    html += `
      <div style="margin-bottom: 12px;">
        <label>${cat.emoji} ${cat.name}</label>
        <input type="number" class="budget-input" data-cat="${cat.id}" value="${data.budgets[cat.id] || 0}" step="1" min="0">
      </div>
    `;
  });
  document.getElementById('budgetFormFields').innerHTML = html;
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => e.target === m && closeModal(m.id));
});

renderAll();
</script>
</body>
</html>
